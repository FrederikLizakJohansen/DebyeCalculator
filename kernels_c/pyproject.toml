[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "debyecalculator-ckernels"
version = "1.1.0"
description = "Optional native CPU kernels (C prototype) for the DebyeCalculator grid pair sum"
license = { text = "Apache-2.0" }
requires-python = ">=3.8"
dependencies = ["numpy>=1.21.5"]

[tool.setuptools]
packages = ["debyecalculator_ckernels"]

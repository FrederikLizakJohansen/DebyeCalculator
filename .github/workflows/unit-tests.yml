name: Unit tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.14"

    env:
      QT_QPA_PLATFORM: offscreen
      PIP_NO_CACHE_DIR: "1"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Qt system libraries
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

    - name: Install PyTorch (CPU)
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ "$RUNNER_OS" == "Linux" ]; then
          pip install torch --index-url https://download.pytorch.org/whl/cpu
        else
          pip install torch
        fi

    - name: Install DebyeCalculator with the GUI extra
      run: pip install -e ".[gui]" pytest

    - name: Run pytest
      run: pytest -q debyecalculator

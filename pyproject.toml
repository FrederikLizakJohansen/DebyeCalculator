[tool.poetry]
name = "DebyeCalculator"
version = "1.1.0"
description = "A vectorised implementation of the Debye Equation on CPU and GPU"
license = "Apache-2.0"
authors = [
  "Frederik Lizak Johansen <frjo@di.ku.dk>",
  "Andy Sode Anker <ansoan@dtu.dk>",
]
readme = "README.md"
repository = "https://github.com/FrederikLizakJohansen/DebyeCalculator"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
packages = [
  {include = "debyecalculator"},
]

[tool.poetry.dependencies]
python = ">=3.8,<3.14"
numpy = ">=1.21.5"
matplotlib = ">=3.4.3"
pyyaml = ">=6.0.1"
tqdm = ">=4.66.1"
ase = ">=3.22.1"
pymatgen = {version = ">=2020.0.0", python = ">=3.10"}
notebook = ">=6.4.1"
ipywidgets = ">=8.0.3"
scipy = ">=1.7.3"
prettytable = ">=3.0.0"
pyside6 = {version = ">=6.5", optional = true}
pyqtgraph = {version = ">=0.13", optional = true}

[tool.poetry.extras]
gui = ["pyside6", "pyqtgraph"]

[tool.poetry.scripts]
debyecalculator-gui = "debyecalculator.gui:main"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "debyecalculator-kernels"
version = "1.1.0"
description = "Optional native CPU kernels for the DebyeCalculator grid pair sum"
license = { text = "Apache-2.0" }
requires-python = ">=3.8"
dependencies = ["numpy>=1.21.5"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[tool.maturin]
module-name = "debyecalculator_kernels"
features = ["pyo3/extension-module"]

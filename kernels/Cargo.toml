[package]
name = "debyecalculator-kernels"
version = "1.1.0"
edition = "2021"
rust-version = "1.88"
description = "Optional native CPU kernels for the DebyeCalculator grid pair sum"
license = "Apache-2.0"
repository = "https://github.com/FrederikLizakJohansen/DebyeCalculator"
publish = false

[lib]
name = "debyecalculator_kernels"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"] }
numpy = "0.29"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
